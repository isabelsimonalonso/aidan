# Secret Detection + publicación en GitLab Pages
stages:
  - test
  - secret-detection
  - deploy

variables:
  SECRET_DETECTION_ENABLED: "true"

secret_detection:
  stage: secret-detection

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

pages:
  stage: deploy
  script:
    - echo "Publicando el contenido de public/"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
