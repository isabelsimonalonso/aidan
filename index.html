<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aidan Antares</title>
  <meta name="description" content="Aidan Antares — Pianista & Compositor" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><rect x='8' y='2' width='8' height='10' rx='1' fill='white'/><rect x='6' y='12' width='12' height='10' rx='1' fill='white'/></svg>" />

  <style>
    :root {
      --dark: #0f0f0f;
      --darker: #0a0a0a;
      --text: #ffffff;
      --muted: #9a9a9a;
      --accent: #d4d4d4;
      --accent2: #b0b0b0;
      --accent3: #808080;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: var(--text);
      line-height: 1.6;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 50%, rgba(212, 212, 212, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(176, 176, 176, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ============ CABECERA ============ */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.5rem 2rem;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .site-name {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 800;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .header-tag {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      position: relative;
    }

    .language-selector {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .lang-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      letter-spacing: 0.05em;
      border-bottom: 2px solid transparent;
      opacity: 1;
    }

    .lang-btn:hover {
      opacity: 1;
    }

    .lang-btn.active {
      opacity: 1;
      border-bottom-color: var(--accent);
    }

    .footer-text-btn {
      width: auto !important;
      height: auto !important;
      padding: 0.5rem 0.75rem !important;
      font-size: 0.9rem !important;
      font-weight: 500 !important;
      letter-spacing: 0.05em;
      border: none !important;
      background: transparent !important;
      border-radius: 0 !important;
      border-bottom: 2px solid transparent !important;
      color: var(--text) !important;
      opacity: 1;
      transition: all 0.3s ease;
    }

    .footer-text-btn:hover {
      opacity: 1;
    }

    .footer-text-btn.active {
      opacity: 1;
      border-bottom-color: var(--accent) !important;
    }

    /* ============ MAIN ============ */
    main {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 8rem 2rem 6rem;
      position: relative;
      z-index: 1;
    }

    /* ============ HERO ============ */
    .hero {
      margin-bottom: 8rem;
      text-align: center;
    }

    .hero-content {
      margin-bottom: 4rem;
    }

    .hero-title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 1rem;
      color: var(--text);
    }

    .hero-subtitle {
      font-size: 1.1rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 2rem;
    }

    .hero-cta {
      display: inline-block;
      padding: 0.75rem 2rem;
      margin-top: 1.5rem;
      border: 2px solid var(--accent);
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .hero-cta::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--accent);
      transition: left 0.3s ease;
      z-index: -1;
    }

    .hero-cta:hover {
      color: var(--darker);
    }

    .hero-cta:hover::before {
      left: 0;
    }

    .hero-frame {
      width: 100%;
      max-width: 550px;
      margin: 0 auto;
      aspect-ratio: 1107 / 843;
      border-radius: 0;
      overflow: hidden;
      border: none;
      background: transparent;
      transition: all 0.3s ease;
    }

    .hero-frame:hover {
      border-color: transparent;
    }

    .hero-photo {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    .photo-placeholder {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-align: center;
    }

    .hero-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ============ SECCIONES ============ */
    section { margin-bottom: 6rem; }

    .section-title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
      position: relative;
      text-align: center;
    }

    .section-title::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), transparent);
      opacity: 0.6;
    }

    /* ============ BIOGRAFÍA ============ */
    .bio {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 700px;
      line-height: 1.9;
      margin-top: 1rem;
      margin-left: auto;
      margin-right: auto;
    }

    .bio-section .bio {
      text-align: center;
    }

    .awards-section .bio {
      text-align: center;
    }

    /* ============ VÍDEOS ============ */
    .videos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .video-embed {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 40px rgba(212, 212, 212, 0.1);
      transition: all 0.3s ease;
    }

    .video-embed:hover {
      border-color: var(--accent);
      box-shadow: 0 0 60px rgba(212, 212, 212, 0.15);
      transform: translateY(-6px);
    }

    .video-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .video-placeholder span {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    @media (max-width: 900px) {
      .videos { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .videos { grid-template-columns: 1fr; }
    }

    /* ============ REDES ============ */
    .socials {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2rem;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border: 2px solid var(--border);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.02);
      color: var(--text);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .social-link::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(212, 212, 212, 0.2);
      transform: scale(0);
      transition: transform 0.3s ease;
      z-index: -1;
      border-radius: 50%;
    }

    .social-link:hover {
      border-color: var(--accent);
      transform: translateY(-8px) scale(1.1);
    }

    .social-link:hover::before {
      transform: scale(1);
    }

    .social-link svg {
      width: 24px;
      height: 24px;
      transition: filter 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .social-link:hover svg {
      filter: invert(1);
    }

    /* ============ ICONOS ============ */
    .icons-section {
      text-align: center;
      margin-bottom: 4rem;
    }

    .all-icons {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    /* ============ FOOTER ============ */
    footer {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-top: 1px solid var(--border);
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 768px) {
      main { padding: 6rem 1.5rem 4rem; }
      .site-name { font-size: 1.3rem; }
      .socials { gap: 1rem; }
      .social-link { width: 48px; height: 48px; }
      .language-selector { display: none !important; }
      .footer-lang-selector { display: flex !important; gap: 0.5rem; justify-content: center; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 class="site-name">AIDAN ANTARES</h1>
    <div style="display: flex; gap: 2rem; align-items: center;">
      <div class="language-selector">
        <button class="lang-btn active" data-lang="es" title="Español">ES</button>
        <span style="opacity: 0.3; margin: 0 0.25rem;">|</span>
        <button class="lang-btn" data-lang="en" title="English">EN</button>
      </div>
      <span class="header-tag">Pianista &amp; Compositor</span>
    </div>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero">
      <div class="hero-content">
        <h2 class="hero-subtitle" data-i18n="hero.subtitle">Bienvenido a mi universo</h2>
        <h1 class="hero-title">Aidan Antares</h1>
        <a href="https://open.spotify.com" target="_blank" rel="noopener" class="hero-cta" data-i18n="hero.cta">Escúchame</a>
      </div>

      <div class="hero-frame">
        <div class="hero-photo">
          <img src="./portada.jpg" alt="Aidan Antares — Pianista & Compositor" />
        </div>
      </div>
    </section>

    <!-- BIOGRAFÍA -->
    <section class="bio-section">
      <h2 class="section-title" data-i18n="sections.bio">Biografía</h2>
      <p class="bio" data-i18n="content.construction">
        En construcción
      </p>
    </section>

    <!-- PREMIOS -->
    <section class="awards-section">
      <h2 class="section-title" data-i18n="sections.awards">Premios</h2>
      <p class="bio" data-i18n="content.construction">
        En construcción
      </p>
    </section>

    <!-- ÚLTIMAS ACTUACIONES -->
    <section class="videos-section">
      <h2 class="section-title" data-i18n="sections.performances">Últimas actuaciones</h2>
      <div class="videos">
        <div class="video-embed">
          <iframe src="https://www.youtube.com/embed/d-ZoPMPleXE" title="Vídeo 1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>
        </div>
        <div class="video-embed video-placeholder">
          <span>En construcción</span>
        </div>
        <div class="video-embed video-placeholder">
          <span>En construcción</span>
        </div>
      </div>
    </section>

    <!-- ICONOS -->
    <section class="icons-section">
      <div class="all-icons">
        <a class="social-link" href="https://www.instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>

        <a class="social-link" href="https://www.tiktok.com" target="_blank" rel="noopener" aria-label="TikTok">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43V8.69a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.12z"></path>
          </svg>
        </a>

        <a class="social-link" href="https://www.spotify.com" target="_blank" rel="noopener" aria-label="Spotify">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.59 14.42a.62.62 0 0 1-.86.21c-2.35-1.44-5.3-1.76-8.79-.96a.62.62 0 1 1-.28-1.22c3.81-.87 7.08-.5 9.72 1.11a.62.62 0 0 1 .21.86zm1.22-2.72a.78.78 0 0 1-1.07.26c-2.69-1.65-6.79-2.13-9.97-1.17a.78.78 0 1 1-.45-1.49c3.63-1.1 8.15-.56 11.24 1.33a.78.78 0 0 1 .25 1.07zm.11-2.84C14.8 8.93 9.5 8.75 6.44 9.68a.93.93 0 1 1-.54-1.78c3.51-1.07 9.36-.86 13.05 1.33a.93.93 0 1 1-.95 1.6z"></path>
          </svg>
        </a>

        <a class="social-link" href="https://www.youtube.com" target="_blank" rel="noopener" aria-label="YouTube">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M23 12s0-3.6-.46-5.32a2.78 2.78 0 0 0-1.95-1.96C18.88 4.25 12 4.25 12 4.25s-6.88 0-8.59.47a2.78 2.78 0 0 0-1.95 1.96C1 8.4 1 12 1 12s0 3.6.46 5.32a2.78 2.78 0 0 0 1.95 1.96c1.71.47 8.59.47 8.59.47s6.88 0 8.59-.47a2.78 2.78 0 0 0 1.95-1.96C23 15.6 23 12 23 12zM9.75 15.5v-7l6 3.5-6 3.5z"></path>
          </svg>
        </a>

        <a class="social-link" href="mailto:ejemplo@correo.com" aria-label="Email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
        </a>

      </div>
    </section>
  </main>

  <footer>
    <div style="margin-bottom: 1rem; display: none;" class="footer-lang-selector">
      <button class="lang-btn footer-text-btn active" data-lang="es" title="Español">ES</button>
      <span style="opacity: 0.3; margin: 0 0.25rem;">|</span>
      <button class="lang-btn footer-text-btn" data-lang="en" title="English">EN</button>
    </div>
    &copy; <span id="year"></span> Aidan Antares. <span data-i18n="footer.rights">Todos los derechos reservados</span>.
  </footer>

  <script>
    const translations = {
      es: {
        "hero.subtitle": "Bienvenido a mi universo",
        "hero.cta": "Escúchame",
        "sections.bio": "Biografía",
        "sections.awards": "Premios",
        "sections.performances": "Últimas actuaciones",
        "content.construction": "En construcción",
        "footer.rights": "Todos los derechos reservados"
      },
      en: {
        "hero.subtitle": "Welcome to my universe",
        "hero.cta": "Listen to me",
        "sections.bio": "Biography",
        "sections.awards": "Awards",
        "sections.performances": "Latest Performances",
        "content.construction": "Under construction",
        "footer.rights": "All rights reserved"
      }
    };

    function setLanguage(lang) {
      document.documentElement.lang = lang;
      localStorage.setItem("language", lang);

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });

      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.remove("active");
        if (btn.getAttribute("data-lang") === lang) {
          btn.classList.add("active");
        }
      });
    }

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        setLanguage(btn.getAttribute("data-lang"));
      });
    });

    const savedLanguage = localStorage.getItem("language") || "es";
    setLanguage(savedLanguage);
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
